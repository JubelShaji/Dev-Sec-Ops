global:
  scrape_interval: 15s

scrape_configs:

# Prometheus host itself
- job_name: prometheus-host
  static_configs:
    - targets: ["{prometheus-ip}:9100"]

# Jenkins host
- job_name: jenkins-host
  static_configs:
    - targets: ["{jenkins-ip}:9100"]

# Jenkins application
- job_name: jenkins
  metrics_path: /prometheus
  static_configs:
    - targets: ["{jenkins-ip}:8080"]

# Kubernetes Node Exporters
- job_name: k8s-workers
  static_configs:
    - targets:
        - "{worker1-ip}:9100"
        - "{worker2-ip}:9100"

# Kubernetes kubelet / cAdvisor
- job_name: kubernetes-kubelet
  scheme: https

  kubernetes_sd_configs:
    - role: node
      api_server: https://{k8s-API-ip}:6443  # kubectl cluste-info
      bearer_token_file: /etc/prometheus/k8s-token
      tls_config:
        ca_file: /etc/prometheus/k8s-ca.crt

  relabel_configs:
  - source_labels: [__meta_kubernetes_node_address_InternalIP]
    target_label: __address__
    replacement: $1:10250

  # cAdvisor metrics path
  - target_label: __metrics_path__
    replacement: /metrics/cadvisor

